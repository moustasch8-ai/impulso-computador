name: Test Oferta Radar API

on:
  push:
    branches:
      - main
    paths:
      - 'oferta-radar/backend/**'
      - 'oferta-radar/app.js'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'oferta-radar/backend/**'
      - 'oferta-radar/app.js'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: oferta-radar/backend
      - name: Validate JavaScript
        run: node --check server.js && node --check smoke-test.js && node --check ../app.js && node --check ../config.js
        working-directory: oferta-radar/backend
      - name: Test public API
        run: npm test
        working-directory: oferta-radar/backend
