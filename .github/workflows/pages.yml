name: Publish Impulso website

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'oferta-radar/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Validate Oferta Radar scripts
        run: node --check oferta-radar/config.js && node --check oferta-radar/app.js && node --check oferta-radar/backend/server.js && node --check oferta-radar/backend/smoke-test.js
      - name: Test public Oferta Radar API
        run: npm install --no-audit --no-fund && npm test
        working-directory: oferta-radar/backend
      - name: Add Oferta Radar frontend to Pages
        run: |
          mkdir -p site/oferta-radar
          cp oferta-radar/index.html oferta-radar/styles.css oferta-radar/config.js oferta-radar/app.js oferta-radar/privacidade.html oferta-radar/termos.html site/oferta-radar/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
